# Default = DEV. Local development with the Vite dev server + HMR.
# The app runs on a stock node image with the source bind-mounted — no build step,
# no Dockerfile needed here. Production lives in docker-compose.prod.yml (uses Dockerfile).
services:

  client:
    image: node:22-alpine
    container_name: s2s-client
    restart: unless-stopped
    working_dir: /app
    # Vite reads VITE_* vars from .env at dev time as well.
    env_file: .env
    environment:
      HUSKY: "0"                    # skip husky git-hook install during `npm install`
      # On Docker Desktop (macOS/Windows) bind-mount FS events may not propagate;
      # add the next line to force polling if HMR doesn't trigger (native inotify works on Linux):
      # CHOKIDAR_USEPOLLING: "true"
    # Install deps into the named volume, then run Vite on port 5173.
    # --no-open: there is no xdg-open in the container (vite.config has open: true).
    # Port 5173 avoids clashing with the backend on host port 3000.
    command: sh -c "npm install && npm run start -- --host --no-open --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - client_node_modules:/app/node_modules
    labels:
      traefik.enable: "true"
      traefik.http.routers.s2s-http.rule: "Host(`s2s.docker.localhost`)"
      traefik.http.routers.s2s-http.entrypoints: http
      traefik.http.routers.s2s-http.middlewares: https-redirect@file
      traefik.http.routers.s2s-https.rule: "Host(`s2s.docker.localhost`)"
      traefik.http.routers.s2s-https.entrypoints: https
      traefik.http.routers.s2s-https.tls: "true"
      traefik.http.services.s2s.loadbalancer.server.port: "5173"

volumes:
  client_node_modules:
